<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso administrador | Observatorio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:520px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">Acceso del administrador</h1><p>Solo personal autorizado. El dashboard público no requiere iniciar sesión.</p><div class="alert alert-danger" th:if="${param.error}">Credenciales incorrectas.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Usuario<input name="username" autocomplete="username" class="form-control" required></label><br><label class="form-label">Contraseña<input name="password" type="password" autocomplete="current-password" class="form-control" required></label><br><button class="btn btn-primary">Ingresar</button> <a class="btn btn-outline-secondary" href="/dashboard">Volver al dashboard</a></form></div></div></main></body></html>
